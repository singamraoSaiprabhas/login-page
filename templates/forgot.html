<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
    <style>/* Reuse CSS */ body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; } .container { background-color: #fff; padding: 40px; border-radius: 8px; width: 320px; } input { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; } button { width: 100%; padding: 12px; background-color: #ffc107; border: none; border-radius: 4px; cursor: pointer; }</style>
</head>
<body>
    <div class="container">
        <h2>Reset Password</h2>
        
        <!-- Step 1: Request OTP -->
        {% if step == 1 %}
        <form action="/forgot" method="POST">
            <p>Enter your phone number to receive an OTP.</p>
            <input type="text" name="phone" placeholder="Phone Number" required>
            <button type="submit">Send OTP</button>
        </form>
        {% endif %}

        <!-- Step 2: Verify OTP & New Password -->
        {% if step == 2 %}
        <form action="/reset" method="POST">
            <p>Check your terminal for the OTP.</p>
            <input type="text" name="otp" placeholder="Enter 6-digit OTP" required>
            <input type="password" name="new_password" placeholder="New Password" required>
            <button type="submit">Update Password</button>
        </form>
        {% endif %}

        {% if message %}<p style="color:red;">{{ message }}</p>{% endif %}
        <p style="text-align: center;"><a href="/">Cancel</a></p>
    </div>
</body>
</html>
